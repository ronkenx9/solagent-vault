<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ SolAgent Vault — The Dungeon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════
       PIXEL RPG DESIGN SYSTEM
       ═══════════════════════════════════════════ */
        :root {
            --bg-deep: #0c0e1a;
            --bg-dungeon: #151834;
            --bg-panel: #1a1f3d;
            --bg-panel-hover: #222850;
            --border-pixel: #2a3060;
            --border-gold: #ffd700;
            --text-parchment: #e2e4f3;
            --hp-green: #4ade80;
            --mp-blue: #60a5fa;
            --xp-gold: #fbbf24;
            --danger-red: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-parchment);
            font-family: 'Silkscreen', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* ═══ RETRO STATUS BAR ═══ */
        .retro-status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-size: 10px;
            color: #8892b0;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--danger-red);
            border-radius: 50%;
            box-shadow: 0 0 5px #000;
        }

        .status-dot.online {
            background: var(--hp-green);
            box-shadow: 0 0 8px var(--hp-green);
        }

        /* ═══ PIXEL BORDERS ═══ */
        .pixel-border {
            border: 4px solid var(--border-pixel);
            position: relative;
            background: var(--bg-panel);
            box-shadow: inset -4px -4px 0px rgba(0, 0, 0, 0.2);
        }

        .pixel-border-gold {
            border: 4px solid var(--border-gold);
            position: relative;
            background: var(--bg-panel);
            box-shadow: inset -4px -4px 0px rgba(0, 0, 0, 0.2), 0 0 15px rgba(255, 215, 0, 0.1);
        }



        /* ═══ PARTY GRID ═══ */
        .party-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 40px;
        }

        .char-card {
            padding: 20px;
            transition: transform 0.2s, background 0.2s;
        }

        .char-card:hover {
            transform: translateY(-5px);
            background: var(--bg-panel-hover);
        }

        .char-header {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .char-avatar {
            width: 64px;
            height: 64px;
            background: #000;
            border: 4px solid var(--border-pixel);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .char-avatar canvas {
            width: 48px;
            height: 48px;
        }

        .char-class-badge {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: var(--bg-deep);
            border: 2px solid var(--border-pixel);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .char-info {
            flex: 1;
        }

        .char-name {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .char-class {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
        }

        .char-level {
            font-size: 10px;
            color: var(--border-gold);
        }

        .berserker {
            color: var(--danger-red);
        }

        .paladin {
            color: var(--mp-blue);
        }

        .alchemist {
            color: var(--xp-gold);
        }

        /* ═══ STAT BARS ═══ */
        .stat-bars {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            width: 25px;
        }

        .stat-bar-track {
            flex: 1;
            height: 12px;
            background: #000;
            border: 2px solid var(--border-pixel);
            position: relative;
        }

        .stat-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-out;
            position: relative;
        }

        .stat-bar-fill.hp {
            background: var(--hp-green);
        }

        .stat-bar-fill.mp {
            background: var(--mp-blue);
        }

        .stat-bar-fill.xp {
            background: var(--xp-gold);
        }

        .stat-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 7px;
            width: 105px;
            text-align: right;
            flex-shrink: 0;
            color: var(--text-parchment);
        }

        /* ═══ EQUIPMENT / POLICY SLOTS ═══ */
        .equipment {
            display: flex;
            gap: 6px;
            margin: 10px 0 6px;
            flex-wrap: wrap;
        }

        .equip-slot {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-pixel);
            padding: 3px 8px;
            font-size: 10px;
            color: #aaa;
            margin-bottom: 2px;
        }

        .equip-icon {
            font-size: 10px;
            margin-right: 4px;
        }

        /* Policy Controls (Level Up/Down) */
        .policy-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .level-btn {
            padding: 6px 4px;
            background: #2a2f4d;
            color: var(--text-parchment);
            border: 2px solid var(--border-pixel);
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 7px;
            flex: 1;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .level-btn:hover {
            background: var(--bg-panel-hover);
            border-color: #fff;
            color: #fff;
        }

        .level-btn.up:hover {
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            color: #ffd700;
        }

        .level-btn.down:hover {
            box-shadow: 0 0 10px rgba(255, 100, 100, 0.3);
            color: #ff6464;
        }

        .level-btn:active {
            transform: scale(0.95);
        }

        .level-btn.loading {
            opacity: 0.5;
            cursor: wait;
        }

        .limit-display {
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            color: #00ff00;
            text-align: center;
            margin-top: 10px;
            padding: 5px;
            background: rgba(0, 255, 0, 0.05);
            border: 1px dashed #008800;
        }

        /* ═══ ACTION DISPLAY ═══ */
        .last-action {
            margin-top: 15px;
            background: #000;
            border: 2px solid var(--border-pixel);
            padding: 10px;
            font-size: 10px;
            height: 60px;
            overflow: hidden;
            color: #888;
        }

        .action-type {
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            color: var(--text-parchment);
            margin-bottom: 6px;
        }

        .tag-buy {
            color: #4ade80;
        }

        .tag-sell {
            color: #f87171;
        }

        .tag-swap {
            color: #60a5fa;
        }

        /* ═══ PARTY STATS ═══ */
        .party-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 20px;
        }

        .party-stat {
            text-align: center;
        }

        .party-stat-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            color: var(--border-gold);
            margin-bottom: 4px;
        }

        .party-stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        /* ═══ BATTLE LOG ═══ */
        .battle-log-container {
            width: 100%;
            max-width: 1100px;
        }

        .battle-log {
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Silkscreen', cursive;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .battle-log-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            color: var(--border-gold);
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border-pixel);
            padding-bottom: 5px;
            position: sticky;
            top: 0;
            background: var(--bg-panel);
            z-index: 10;
        }

        .log-entry {
            display: flex;
            gap: 12px;
            line-height: 1.4;
        }

        .log-time {
            color: #555;
            min-width: 65px;
        }

        .log-agent {
            font-weight: bold;
            min-width: 70px;
        }

        .log-action {
            flex: 1;
        }

        .success {
            color: var(--hp-green);
        }

        .warning {
            color: var(--xp-gold);
        }

        .danger {
            color: var(--danger-red);
        }

        /* ═══ DECO ═══ */
        .ground-deco {
            margin-top: 40px;
            color: #2a3060;
            font-size: 12px;
            opacity: 0.5;
        }

        /* ═══ ANIMATIONS ═══ */
        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .idle-bounce {
            animation: bounce 2s infinite ease-in-out;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-pixel);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--bg-panel-hover);
        }

        /* ═══ VAULT TOTAL (RETRO) ═══ */
        .vault-total-retro {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 12px 24px;
            background: var(--bg-panel);
            border: 4px solid var(--border-gold);
            margin: 40px auto 20px auto;
            position: relative;
            box-shadow: inset -4px -4px 0px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 215, 0, 0.1);
            width: fit-content;
        }

        .vault-total-retro-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 20px;
            color: var(--border-gold);
            text-shadow: 2px 2px #000;
        }

        .coin-container-small {
            perspective: 400px;
            width: 20px;
            height: 20px;
        }

        .coin-small {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 4s ease-in-out infinite;
        }

        .coin-face-small {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            background: radial-gradient(circle, #ffd700 30%, #daa520 80%);
            border: 2px solid #b8860b;
        }

        .coin-front-small {
            transform: rotateY(0deg) translateZ(2px);
        }

        .coin-back-small {
            transform: rotateY(180deg) translateZ(-2px);
        }

        .coin-edge-small {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #b8860b;
            transform: rotateY(90deg);
            left: 0;
            top: 0;
        }

        @keyframes spin {
            0% {
                transform: rotateY(-30deg);
            }

            50% {
                transform: rotateY(30deg);
            }

            100% {
                transform: rotateY(-30deg);
            }
        }

        /* ═══ MAIN TITLE ═══ */
        .main-title {
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 28px;
            color: var(--text-parchment);
            margin-top: 40px;
            margin-bottom: -20px;
            text-shadow: 3px 3px #000;
            letter-spacing: -2px;
            z-index: 10;
        }
    </style>
</head>

<body>

    <!-- MAIN TITLE -->
    <div class="main-title">
        ⚔️ THE VAULT ⚔️
    </div>

    <!-- VAULT TOTAL (RETRO) -->
    <div class="vault-total-retro">
        <div class="coin-container-small">
            <div class="coin-small">
                <div class="coin-face-small coin-front-small"></div>
                <div class="coin-edge-small"></div>
                <div class="coin-face-small coin-back-small"></div>
            </div>
        </div>
        <div class="vault-total-retro-value" id="globalTotalSol">0.000 SOL</div>
    </div>

    <!-- STATUS BAR -->
    <div class="retro-status-bar">
        <div class="status-item">
            <div class="status-dot" id="sseDot"></div>
            VAULT: <span id="vaultStatusText" style="margin-left:4px;">OFFLINE</span>
        </div>
        <div class="status-item">
            <div class="status-dot" id="apiDot"></div>
            EVENTS: <span id="apiStatusText" style="margin-left:4px;">RECONNECTING...</span>
        </div>
        <div class="status-item">
            🛡️ TICK: <span id="totalTicks" style="margin-left:4px;">0</span>
        </div>
    </div>

    <div class="party-grid" id="partyGrid">
        <!-- Agents will be dynamically injected here via JS -->
    </div>

    <!-- ═══ PARTY STATS ═══ -->
    <div class="party-stats">
        <div class="party-stat">
            <div class="party-stat-value" id="totalTrades">0</div>
            <div class="party-stat-label">Quests Complete</div>
        </div>
        <div class="party-stat">
            <div class="party-stat-value" id="totalHolds">0</div>
            <div class="party-stat-label">Defended</div>
        </div>
        <div class="party-stat">
            <div class="party-stat-value" id="totalTicks">0</div>
            <div class="party-stat-label">Adventures</div>
        </div>
    </div>

    <!-- ═══ BATTLE LOG ═══ -->
    <div class="battle-log-container">
        <div class="battle-log pixel-border-gold" id="battleLog">
            <div class="battle-log-title">📜 BATTLE LOG</div>
            <div id="logEntries">
                <div class="log-entry">
                    <span class="log-time">00:00</span>
                    <span class="log-action">The party assembles at the entrance of the Vault...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="ground-deco">· · · ◆ · · · ◆ · · · ◆ · · ·</div>

    <script>
        // ═══════════════════════════════════════════
        // PIXEL AVATAR RENDERER
        // ═══════════════════════════════════════════

        const AVATARS = {
            momentum: {
                // Berserker — red warrior with sword
                pixels: [
                    '....RRRR....',
                    '...RRRRR...',
                    '..RFFFRR...',
                    '..FBBFBF...',
                    '..FFFFFF...',
                    '...RRRR....',
                    '..RRSRR....',
                    '.RRRRRRR...',
                    '....R.R....',
                    '....R.R....',
                    '....F.F....',
                    '....F.F....',
                ],
                colors: { 'R': '#f87171', 'F': '#e2e4f3', 'B': '#2a3060', 'S': '#ffd700' }
            },
            conservative: {
                // Paladin — blue warrior with shield
                pixels: [
                    '....BBBB....',
                    '...BBBBB...',
                    '..BFFBBB...',
                    '..FBBFBF...',
                    '..FFFFFF...',
                    '...BBBB....',
                    '..BBBBB....',
                    '.BBBBBBB...',
                    '....B.B....',
                    '....B.B....',
                    '....F.F....',
                    '....F.F....',
                ],
                colors: { 'B': '#60a5fa', 'F': '#e2e4f3' }
            },
            rebalancer: {
                // Alchemist — gold mage with robes
                pixels: [
                    '....YYYY....',
                    '...YYYYY...',
                    '..YFFYYY...',
                    '..FYYFYF...',
                    '..FFFFFF...',
                    '...YYYY....',
                    '..YYYYY....',
                    '.YYYYYYY...',
                    '....Y.Y....',
                    '....Y.Y....',
                    '....F.F....',
                    '....F.F....',
                ],
                colors: { 'Y': '#fbbf24', 'F': '#e2e4f3' }
            }
        };

        function drawAvatar(canvasId, type) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const data = AVATARS[type];
            if (!data) return;

            canvas.width = 12;
            canvas.height = 12;
            ctx.clearRect(0, 0, 12, 12);

            data.pixels.forEach((row, y) => {
                for (let x = 0; x < row.length; x++) {
                    const c = row[x];
                    if (c !== '.' && data.colors[c]) {
                        ctx.fillStyle = data.colors[c];
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            });
        }

        // Draw all avatars
        drawAvatar('avatar-momentum', 'momentum');
        drawAvatar('avatar-conservative', 'conservative');
        drawAvatar('avatar-rebalancer', 'rebalancer');

        // ═══════════════════════════════════════════
        // STATE & CONSTANTS
        // ═══════════════════════════════════════════

        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3001'
            : '';

        let AGENT_MAP = {};
        let AGENT_MAP_BY_KEY = {};

        const state = {
            balances: {},
            trades: {},
            limits: {},
            totalTrades: 0,
            totalHolds: 0,
            totalTicks: 0,
            apiOnline: false,
            sseConnected: false,
        };

        // ═══════════════════════════════════════════
        // HEALPERS & UI
        // ═══════════════════════════════════════════

        function addLog(agentKey, cls, message, actionCls) {
            const container = document.getElementById('logEntries');
            if (!container) return;
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">${time}</span>
                <span class="log-agent ${cls}">${AGENT_MAP_BY_KEY[agentKey]?.name || agentKey}</span>
                <span class="log-action ${actionCls || ''}">${message}</span>
            `;
            container.appendChild(entry);
            while (container.children.length > 50) container.removeChild(container.firstChild);
            const log = document.getElementById('battleLog');
            if (log) log.scrollTop = log.scrollHeight;
        }

        // ═══════════════════════════════════════════
        // POLICY CONTROL LOGIC (LEVEL UP/DOWN)
        // ═══════════════════════════════════════════

        async function levelUp(agentId) {
            const data = AGENT_MAP[agentId];
            if (!data) return;

            const currentLimit = state.limits[data.key] || 0.5;
            const nextLimit = currentLimit * 1.5;

            const btn = document.querySelector(`#card-${data.key} .level-btn.up`);
            if (btn) btn.classList.add('loading');

            addLog(data.key, data.cls, `Attempting to LEVEL UP ${data.name}... Increasing cap to ${nextLimit.toFixed(2)} SOL.`, '');

            try {
                const response = await fetch(`${API_BASE}/vault/policy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent_id: agentId,
                        max_lamports_per_tx: Math.floor(nextLimit * 1e9),
                    })
                });

                if (response.ok) {
                    state.limits[data.key] = nextLimit;
                    const limitEl = document.getElementById(`limit-${data.key}`);
                    if (limitEl) limitEl.innerText = `Limit: ${nextLimit.toFixed(2)} SOL`;
                    addLog(data.key, data.cls, `LEVEL UP SUCCESS! ${data.name} is now more powerful. New cap: ${nextLimit.toFixed(2)} SOL.`, 'success');
                } else {
                    addLog(data.key, data.cls, `LEVEL UP FAILED! Server returned ${response.status}.`, 'danger');
                }
            } catch (err) {
                console.error(err);
                addLog(data.key, data.cls, `LEVEL UP CRASH! Check API connection.`, 'danger');
            } finally {
                if (btn) btn.classList.remove('loading');
            }
        }

        async function levelDown(agentId) {
            const data = AGENT_MAP[agentId];
            if (!data) return;

            const currentLimit = state.limits[data.key] || 0.5;
            const nextLimit = Math.max(0.01, currentLimit / 1.5);

            const btn = document.querySelector(`#card-${data.key} .level-btn.down`);
            if (btn) btn.classList.add('loading');

            addLog(data.key, data.cls, `Attempting to LEVEL DOWN ${data.name}... Reducing risk to ${nextLimit.toFixed(2)} SOL.`, '');

            try {
                const response = await fetch(`${API_BASE}/vault/policy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent_id: agentId,
                        max_lamports_per_tx: Math.floor(nextLimit * 1e9),
                    })
                });

                if (response.ok) {
                    state.limits[data.key] = nextLimit;
                    const limitEl = document.getElementById(`limit-${data.key}`);
                    if (limitEl) limitEl.innerText = `Limit: ${nextLimit.toFixed(2)} SOL`;
                    addLog(data.key, data.cls, `LEVEL DOWN SUCCESS! ${data.name} has been restrained. New cap: ${nextLimit.toFixed(2)} SOL.`, 'warning');
                } else {
                    addLog(data.key, data.cls, `LEVEL DOWN FAILED! Server returned ${response.status}.`, 'danger');
                }
            } catch (err) {
                console.error(err);
                addLog(data.key, data.cls, `LEVEL DOWN CRASH! Check API connection.`, 'danger');
            } finally {
                if (btn) btn.classList.remove('loading');
            }
        }

        // ═══════════════════════════════════════════
        // UI UPDATES
        // ═══════════════════════════════════════════

        function updateUI() {
            // Update counts
            document.getElementById('totalTrades').innerText = state.totalTrades;
            document.getElementById('totalHolds').innerText = state.totalHolds;
            document.getElementById('totalTicks').innerText = state.totalTicks;

            // Connection dots
            const apiDot = document.getElementById('apiDot');
            const sseDot = document.getElementById('sseDot');

            if (apiDot) {
                apiDot.className = `status-dot ${state.apiOnline ? 'online' : ''}`;
                const apiText = document.getElementById('apiStatusText');
                if (apiText) apiText.innerText = state.apiOnline ? 'CONNECTED' : 'RECONNECTING...';
            }

            if (sseDot) {
                sseDot.className = `status-dot ${state.sseConnected ? 'online' : ''}`;
                const vaultText = document.getElementById('vaultStatusText');
                if (vaultText) vaultText.innerText = state.sseConnected ? 'ONLINE' : 'OFFLINE';
            }

            // Global Vault Total
            let globalTotal = 0;

            // Per agent updates
            for (const key in state.balances) {
                const bal = state.balances[key];
                const trades = state.trades[key];
                const max = AGENT_MAP_BY_KEY[key].maxSol || 1.0;

                globalTotal += bal;

                // HP Bar
                const hpPer = Math.min(100, (bal / (max * 10)) * 100);
                const hpBar = document.getElementById(`hp-${key}`);
                if (hpBar) hpBar.style.width = `${hpPer}%`;

                const hpVal = document.getElementById(`hpVal-${key}`);
                if (hpVal) hpVal.innerText = `${bal.toFixed(4)} / ${(max * 10).toFixed(1)} SOL`;

                // XP Bar
                const xpPer = Math.min(100, (trades / 10) * 100);
                const xpBar = document.getElementById(`xp-${key}`);
                if (xpBar) xpBar.style.width = `${xpPer}%`;

                const xpVal = document.getElementById(`xpVal-${key}`);
                if (xpVal) xpVal.innerText = `${trades} trades`;
            }

            // Update Global Total DOM
            const globalEl = document.getElementById('globalTotalSol');
            if (globalEl) globalEl.innerText = `${globalTotal.toFixed(3)} SOL`;
        }

        // ═══════════════════════════════════════════
        // DATA FETCHING
        // ═══════════════════════════════════════════

        async function fetchBalances() {
            try {
                const agentIds = Object.keys(AGENT_MAP).filter(id => !id.includes('-trader') && !id.includes('-holder') && id !== 'rebalancer'); // Filter out aliases if any
                for (const agentId of agentIds) {
                    const res = await fetch(`${API_BASE}/vault/balance/${agentId}`);
                    if (res.ok) {
                        const data = await res.json();
                        const key = AGENT_MAP[agentId].key;
                        state.balances[key] = data.sol;
                    }
                }
                updateUI();
            } catch (err) {
                console.error('Fetch balances failed:', err);
            }
        }

        async function loadAgents() {
            try {
                const res = await fetch(`${API_BASE}/vault/agents`);
                if (!res.ok) throw new Error('Failed to fetch agents');
                const data = await res.json();

                const grid = document.getElementById('partyGrid');
                grid.innerHTML = '';

                const classes = ['berserker', 'paladin', 'alchemist'];
                const classIcons = ['🗡️', '🛡️', '⚗️'];
                const avatars = ['momentum', 'conservative', 'rebalancer'];

                data.agents.forEach((policy, index) => {
                    // Extract agent name uniquely or just use part of ID
                    const rawName = policy.agentId.split('-')[0].toUpperCase();
                    const cleanName = rawName === 'AGENT' ? policy.agentId.split('-')[1].toUpperCase() : rawName;
                    const key = `agent_${index}`;

                    const clsIdx = index % classes.length;
                    const charCls = classes[clsIdx];
                    const charIcon = classIcons[clsIdx];
                    const avatarType = avatars[clsIdx];

                    const limit = policy.maxLamportsPerTx / 1e9;
                    const maxSol = limit * 5; // Visual max capacity

                    AGENT_MAP[policy.agentId] = { key, name: cleanName, cls: charCls, maxSol };
                    AGENT_MAP_BY_KEY[key] = { name: cleanName, cls: charCls };

                    state.balances[key] = 0;
                    state.trades[key] = 0;
                    state.limits[key] = limit;

                    const card = document.createElement('div');
                    card.className = "char-card pixel-border-gold";
                    card.id = `card-${key}`;
                    card.innerHTML = `
                        <div class="char-header">
                            <div class="char-avatar idle-bounce" style="animation-delay: ${index * 0.5}s;">
                                <canvas id="avatar-${key}" width="16" height="16"></canvas>
                                <span class="char-class-badge">${charIcon}</span>
                            </div>
                            <div class="char-info">
                                <div class="char-name ${charCls}">${cleanName}</div>
                                <div class="char-class" style="letter-spacing: 1px;">VAULT AGENT · ${policy.agentId.substring(0, 8)}...</div>
                                <div class="char-level" style="margin-top: 10px;">LV 1</div>
                            </div>
                        </div>
                        <div class="stat-bars">
                            <div class="stat-row">
                                <span class="stat-label hp">HP</span>
                                <div class="stat-bar-track pixel-border">
                                    <div class="stat-bar-fill hp" id="hp-${key}" style="width:0%"></div>
                                </div>
                                <span class="stat-value" id="hpVal-${key}">0 / ${maxSol.toFixed(1)} SOL</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label mp">MP</span>
                                <div class="stat-bar-track pixel-border">
                                    <div class="stat-bar-fill mp" id="mp-${key}" style="width:100%"></div>
                                </div>
                                <span class="stat-value">${policy.maxTxPerMinute} tx/min</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label xp">XP</span>
                                <div class="stat-bar-track pixel-border">
                                    <div class="stat-bar-fill xp" id="xp-${key}" style="width:0%"></div>
                                </div>
                                <span class="stat-value" id="xpVal-${key}">0 trades</span>
                            </div>
                        </div>
                        <div class="limit-display" id="limit-${key}">Limit: ${limit.toFixed(2)} SOL</div>
                        <div class="policy-controls">
                            <button class="level-btn up" onclick="levelUp('${policy.agentId}')"><span>🌟</span> UP</button>
                            <button class="level-btn down" onclick="levelDown('${policy.agentId}')"><span>💀</span> DOWN</button>
                        </div>
                        <div class="last-action" id="action-${key}">
                            <div class="action-type">💤 IDLE</div>
                            Waiting for quest to begin...
                        </div>
                    `;
                    grid.appendChild(card);

                    // Draw Avatar after mount 
                    setTimeout(() => drawAvatar(`avatar-${key}`, avatarType), 10);
                });

            } catch (err) {
                console.error("Failed to load agents:", err);
            }
        }

        async function checkHealth() {
            try {
                const res = await fetch(`${API_BASE}/vault/health`);
                state.apiOnline = res.ok;
                updateUI();
            } catch (err) {
                state.apiOnline = false;
                updateUI();
            }
        }

        // ═══════════════════════════════════════════
        // SSE FEED
        // ═══════════════════════════════════════════

        function connectSSE() {
            const events = new EventSource(`${API_BASE}/vault/events`);

            events.onopen = () => {
                state.sseConnected = true;
                updateUI();
            };

            events.onerror = () => {
                state.sseConnected = false;
                updateUI();
            };

            events.onmessage = (e) => {
                const event = JSON.parse(e.data);
                handleEvent(event);
            };
        }

        function handleEvent(event) {
            const data = AGENT_MAP[event.agentId];
            if (!data) return;

            const key = data.key;

            switch (event.type) {
                case 'tx_executed':
                    state.trades[key]++;
                    state.totalTrades++;
                    addLog(key, data.cls, `📜 SUCCESS! ${event.data.intent.action} intent signed with Immutable Policy Memo. Sig: ${event.data.signature.slice(0, 8)}...`, 'success');
                    updateAction(key, '⚔️ SIGNED & MEMOED', `Executed ${event.data.intent.action} for ${event.data.intent.reasoning}`);
                    fetchBalances();
                    break;

                case 'tx_blocked':
                    const reason = event.data.reason || '';
                    if (reason.includes("Rent Upkeep")) {
                        addLog(key, data.cls, `🔋 RENT SHIELD ACTIVATED! Vault intercepted agent to preserve SOL rent-exemption.`, 'warning');
                        updateAction(key, '🔋 RENT SHIELD', 'Vault prevented agent from draining wallet.');
                    } else if (reason.includes("Simulation") || reason.includes("static analysis")) {
                        addLog(key, data.cls, `🛑 SIMULATION ORACLE FORESAW DOOM! Intent rejected by pre-flight checks: ${reason}`, 'danger');
                        updateAction(key, '🛑 SIM FAILED', 'Vault simulation predicted malicious state change.');
                    } else {
                        addLog(key, data.cls, `🛡️ BLOCKED! Intent rejected by policy: ${reason}`, 'danger');
                        updateAction(key, '🛡️ BLOCKED', reason);
                    }
                    break;

                case 'policy_updated':
                    const nextLimit = event.data.policy.maxLamportsPerTx / 1e9;
                    state.limits[key] = nextLimit;
                    const limitEl = document.getElementById(`limit-${key}`);
                    if (limitEl) limitEl.innerText = `Limit: ${nextLimit.toFixed(2)} SOL`;
                    addLog(key, data.cls, `Policy updated remotely. New cap: ${nextLimit.toFixed(2)} SOL.`, 'warning');
                    break;
            }
            updateUI();
        }

        function updateAction(key, type, msg) {
            const el = document.getElementById(`action-${key}`);
            if (el) {
                el.innerHTML = `
                    <div class="action-type">${type}</div>
                    ${msg}
                `;
            }
        }

        // ═══════════════════════════════════════════
        // INITIALIZATION
        // ═══════════════════════════════════════════

        async function boot() {
            await checkHealth();
            if (state.apiOnline) {
                await loadAgents();
                await fetchBalances();
            }
            connectSSE();

            // Heartbeats
            setInterval(checkHealth, 10000);
            setInterval(fetchBalances, 30000);
            setInterval(() => {
                state.totalTicks++;
                updateUI();
            }, 5000);
        }

        boot();

    </script>
</body>
